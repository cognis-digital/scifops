[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-scifops"
version = "0.1.1"
description = "SCIF/SAPF compliance helpers: badge audit, TPI, escort tracker"
license = { text = "LicenseRef-COCL-1.0" }
requires-python = ">=3.10"
authors = [{name="Cognis Digital", email="suite@cognis.digital"}]
readme = "README.md"
keywords = ["military","ic","dod","cognis-digital","scifops"]
dependencies = []

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
dev = ["pytest>=8.0", "pytest-cov"]

[project.scripts]
"scifops-emit" = "scifops.connect:emit_main"
scifops = "scifops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scifops", "cognis_mil"]
